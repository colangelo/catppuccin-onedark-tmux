# OneDark color overrides for catppuccin/tmux
# Load BEFORE catppuccin.tmux — flavor files use -ogq so they won't
# overwrite these values, and catppuccin's -gF lines will bake OneDark
# colors into format strings at load time.

# Base tones (dark → light)
set -g @thm_bg "#282c34"
set -g @thm_crust "#1b1f27"
set -g @thm_mantle "#21252b"
set -g @thm_base "#282c34"
set -g @thm_surface_0 "#31353f"
set -g @thm_surface_1 "#3e4452"
set -g @thm_surface_2 "#4b5263"
set -g @thm_overlay_0 "#5c6370"
set -g @thm_overlay_1 "#636d83"
set -g @thm_overlay_2 "#828997"
set -g @thm_subtext_0 "#9da5b4"
set -g @thm_subtext_1 "#abb2bf"
set -g @thm_fg "#abb2bf"

# Accent colors
set -g @thm_rosewater "#e8b0ab"
set -g @thm_flamingo "#e06c75"
set -g @thm_pink "#c678dd"
set -g @thm_mauve "#c678dd"
set -g @thm_red "#e06c75"
set -g @thm_maroon "#be5046"
set -g @thm_peach "#d19a66"
set -g @thm_yellow "#e5c07b"
set -g @thm_green "#98c379"
set -g @thm_teal "#56b6c2"
set -g @thm_sky "#56b6c2"
set -g @thm_sapphire "#519fdf"
set -g @thm_blue "#61afef"
set -g @thm_lavender "#7c8dbd"
